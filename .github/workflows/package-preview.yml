name: Package Amethyst preview
on:
  push:
    branches: [build/per-display-default-layout, fix/preview-close-reflow, fix/preview-window-access, codex/automatic-close-reflow]
permissions:
  contents: read
jobs:
  package:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: brew bundle
      - name: Run macOS unit tests
        run: |
          set -o pipefail
          xcodebuild -workspace Amethyst.xcworkspace -scheme Amethyst -derivedDataPath "$RUNNER_TEMP/build" \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 90 test
          xcodebuild -workspace Amethyst.xcworkspace -scheme Amethyst -derivedDataPath "$RUNNER_TEMP/build" \
            -only-testing:AmethystTests/TallWindowCloseTests -test-iterations 3 \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 90 test-without-building | xcbeautify
      - name: Build universal Release app
        run: |
          set -o pipefail
          xcodebuild -workspace Amethyst.xcworkspace -scheme Amethyst -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/build" \
            ONLY_ACTIVE_ARCH=NO 'ARCHS=arm64 x86_64' CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=136 build | xcbeautify
      - name: Package and verify the app
        run: |
          set -eu
          stage="$RUNNER_TEMP/preview"
          mkdir -p "$stage"
          app="$stage/Amethyst.app"
          ditto "$RUNNER_TEMP/build/Build/Products/Release/Amethyst.app" "$app"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier com.github.nevs55.AmethystPreview' "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleDisplayName string Amethyst Preview' "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :SUEnableAutomaticChecks bool false' "$app/Contents/Info.plist"
          codesign --force --deep --sign - "$app"
          ln -s /Applications "$stage/Applications"
          image=Amethyst-preview-136.dmg
          hdiutil create -quiet -volname 'Amethyst Preview' -srcfolder "$stage" -format UDZO "$image"
          mount="$RUNNER_TEMP/verify-preview"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$image"
          trap 'hdiutil detach "$mount"' EXIT
          app="$mount/Amethyst.app"
          codesign --verify --deep --strict --verbose "$app"
          archs=$(xcrun lipo -archs "$app/Contents/MacOS/Amethyst")
          for arch in arm64 x86_64; do
            [[ " $archs " == *" $arch "* ]] || { echo "Missing $arch in $archs"; exit 1; }
          done
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app/Contents/Info.plist")" = 136
          "$app/Contents/MacOS/Amethyst" debug windows --redact-window-titles > "$RUNNER_TEMP/windows-report.txt"
          grep -q '^Accessibility access for this diagnostic:' "$RUNNER_TEMP/windows-report.txt"
          test "$(/usr/libexec/PlistBuddy -c 'Print DTSDKName' "$app/Contents/Info.plist")" = macosx27.0
          codesign -dvv "$app" 2>&1 | grep -Fx 'Identifier=com.github.nevs55.AmethystPreview'
          digest=$(shasum -a 256 "$image" | awk '{print $1}')
          sed -e "s/__DMG_SHA256__/$digest/" -e "s/__BUILD__/136/g" packaging/Update-Amethyst.command.in > Update-Amethyst-136.command
          chmod +x Update-Amethyst-136.command
          bash -n Update-Amethyst-136.command
          sed -e "s/__SOURCE_REVISION__/$GITHUB_SHA/g" -e 's/__PERSONAL_BUILD__/136/g' \
            packaging/Build-Amethyst-Personal.command.in > Build-Amethyst-136-Personal.command
          chmod +x Build-Amethyst-136-Personal.command
          bash -n Build-Amethyst-136-Personal.command
      - uses: actions/upload-artifact@v4
        with:
          name: Amethyst-per-display-preview
          path: |
            Amethyst-preview-136.dmg
            Update-Amethyst-136.command
            Build-Amethyst-136-Personal.command
          compression-level: 0
          if-no-files-found: error

  upgrade:
    needs: package
    runs-on: xcode-27
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Amethyst-per-display-preview
      - name: Exercise the build 135 upgrade
        timeout-minutes: 3
        run: |
          set -euo pipefail
          test ! -e /Applications/Amethyst.app
          old="$RUNNER_TEMP/build-135"
          curl -fsSL https://github.com/nevs55/Amethyst/releases/download/per-display-preview.5/Amethyst-preview-135.dmg -o "$old.dmg"
          echo "5fc130b8e94c6f3e890a68d2e3fd963ef8d056ed1e7d3b8c9ff1b298f3293ed6  $old.dmg" | shasum -a 256 -c -
          hdiutil attach -readonly -nobrowse -mountpoint "$old" "$old.dmg"
          sudo ditto "$old/Amethyst.app" /Applications/Amethyst.app
          hdiutil detach "$old"
          open /Applications/Amethyst.app
          defaults write com.github.nevs55.AmethystPreview layouts -array wide tall wide
          defaults write com.github.nevs55.AmethystPreview display-layout-defaults -dict external tall
          /bin/bash Update-Amethyst-136.command | tee "$RUNNER_TEMP/upgrade.log"
          backup=$(sed -n 's/^Previous app saved at //p' "$RUNNER_TEMP/upgrade.log")
          plist=/usr/libexec/PlistBuddy
          test "$("$plist" -c 'Print CFBundleVersion' "$backup/Contents/Info.plist")" = 135
          test "$("$plist" -c 'Print CFBundleVersion' /Applications/Amethyst.app/Contents/Info.plist)" = 136
          test "$("$plist" -c 'Print CFBundleIdentifier' /Applications/Amethyst.app/Contents/Info.plist)" = com.github.nevs55.AmethystPreview
          defaults read com.github.nevs55.AmethystPreview display-layout-defaults | grep -q tall
          defaults export com.github.nevs55.AmethystPreview "$RUNNER_TEMP/preview-prefs.plist"
          test "$("$plist" -c 'Print layouts:0' "$RUNNER_TEMP/preview-prefs.plist")" = wide
          test "$("$plist" -c 'Print layouts:1' "$RUNNER_TEMP/preview-prefs.plist")" = tall
          test "$("$plist" -c 'Print layouts:2' "$RUNNER_TEMP/preview-prefs.plist")" = wide
